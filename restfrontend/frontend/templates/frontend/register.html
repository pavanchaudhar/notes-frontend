{% extends 'frontend/base.html' %}

{% block content %}
<h2>Register</h2>

<form id="registerForm">
    <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <input type="text" id="username" class="form-control" required>
    </div>
    <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" class="form-control" required>
    </div>
    <button type="submit" class="btn btn-primary">Register</button>
    <p class="mt-3">Already have an account? <a href="/login/">Login</a></p>
</form>

<div id="message" class="mt-3"></div>

<script>
    // Replace with your backend EC2 public IP and port
    const API_BASE = 'http://<backend-ec2-ip>:8000/api';

    document.getElementById('registerForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();
        const messageDiv = document.getElementById('message');

        if (!username || !password) {
            messageDiv.innerHTML = '<div class="alert alert-warning">Please fill in all fields.</div>';
            return;
        }

        try {
            // 1. Register the user
            const registerResponse = await fetch(`${API_BASE}/register/`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            if (!registerResponse.ok) {
                const errData = await registerResponse.json();
                messageDiv.innerHTML = `<div class="alert alert-danger">${errData.error || 'Registration failed'}</div>`;
                return;
            }

            // 2. Registration succeeded – automatically log in
            const loginResponse = await fetch(`${API_BASE}/token/`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            if (!loginResponse.ok) {
                // Registration succeeded but login failed – redirect to login page
                messageDiv.innerHTML = `<div class="alert alert-success">Registration successful! Please <a href="/login/">login</a>.</div>`;
                return;
            }

            const loginData = await loginResponse.json();
            localStorage.setItem('access_token', loginData.access);
            localStorage.setItem('refresh_token', loginData.refresh);

            // 3. Redirect to notes page
            window.location.href = '/notes/';

        } catch (error) {
            console.error('Registration error:', error);
            messageDiv.innerHTML = '<div class="alert alert-danger">Network error – please try again.</div>';
        }
    });
</script>
{% endblock %}

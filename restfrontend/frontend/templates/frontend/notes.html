{% extends 'frontend/base.html' %}
{% block content %}
<h2>My Notes</h2>
<button class="btn btn-success mb-3" id="newNoteBtn">+ New Note</button>
<div id="notesList"></div>
<!-- Modal for creating/editing -->
<div class="modal fade" id="noteModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle">New Note</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="noteForm">
                    <input type="hidden" id="noteId">
                    <div class="mb-3">
                        <label>Title</label>
                        <input type="text" id="noteTitle" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label>Content</label>
                        <textarea id="noteContent" class="form-control" rows="3" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Save</button>
                </form>
            </div>
        </div>
    </div>
</div>
<script>
    const API_BASE = 'http://127.0.0.1:8000/';

    function getAuthHeaders() {
        const token = localStorage.getItem('access_token');
        return { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' };
    }

    async function fetchNotes() {
        const response = await fetch(`${API_BASE}/notes/`, { headers: getAuthHeaders() });
        if (response.status === 401) {
            // attempt refresh token
            await refreshToken();
            return fetchNotes();
        }
        if (response.ok) {
            const notes = await response.json();
            renderNotes(notes);
        } else {
            alert('Failed to load notes');
        }
    }

    function renderNotes(notes) {
        const container = document.getElementById('notesList');
        container.innerHTML = '';
        notes.forEach(note => {
            const div = document.createElement('div');
            div.className = 'card mb-2';
            div.innerHTML = `
                <div class="card-body">
                    <h5 class="card-title">${note.title}</h5>
                    <p class="card-text">${note.content}</p>
                    <button class="btn btn-sm btn-primary editBtn" data-id="${note.id}" data-title="${note.title}" data-content="${note.content}">Edit</button>
                    <button class="btn btn-sm btn-danger deleteBtn" data-id="${note.id}">Delete</button>
                </div>
            `;
            container.appendChild(div);
        });
        // attach event listeners
        document.querySelectorAll('.editBtn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.getElementById('noteId').value = this.dataset.id;
                document.getElementById('noteTitle').value = this.dataset.title;
                document.getElementById('noteContent').value = this.dataset.content;
                document.getElementById('modalTitle').innerText = 'Edit Note';
                const modal = new bootstrap.Modal(document.getElementById('noteModal'));
                modal.show();
            });
        });
        document.querySelectorAll('.deleteBtn').forEach(btn => {
            btn.addEventListener('click', async function() {
                if (confirm('Delete this note?')) {
                    const id = this.dataset.id;
                    const response = await fetch(`${API_BASE}/notes/${id}/`, {
                        method: 'DELETE',
                        headers: getAuthHeaders()
                    });
                    if (response.ok) {
                        fetchNotes();
                    } else {
                        alert('Delete failed');
                    }
                }
            });
        });
    }

    // New note button
    document.getElementById('newNoteBtn').addEventListener('click', function() {
        document.getElementById('noteId').value = '';
        document.getElementById('noteTitle').value = '';
        document.getElementById('noteContent').value = '';
        document.getElementById('modalTitle').innerText = 'New Note';
        const modal = new bootstrap.Modal(document.getElementById('noteModal'));
        modal.show();
    });

    // Submit form (create or update)
    document.getElementById('noteForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const id = document.getElementById('noteId').value;
        const title = document.getElementById('noteTitle').value;
        const content = document.getElementById('noteContent').value;
        const method = id ? 'PUT' : 'POST';
        const url = id ? `${API_BASE}/notes/${id}/` : `${API_BASE}/notes/`;
        const response = await fetch(url, {
            method: method,
            headers: getAuthHeaders(),
            body: JSON.stringify({ title, content })
        });
        if (response.ok) {
            bootstrap.Modal.getInstance(document.getElementById('noteModal')).hide();
            fetchNotes();
        } else {
            alert('Save failed');
        }
    });

    // Logout
    document.getElementById('logoutBtn')?.addEventListener('click', function() {
        localStorage.removeItem('access_token');
        localStorage.removeItem('refresh_token');
        window.location.href = '/login/';
    });

    // Token refresh
    async function refreshToken() {
        const refresh = localStorage.getItem('refresh_token');
        if (!refresh) {
            window.location.href = '/login/';
            return;
        }
        try {
            const response = await fetch(`${API_BASE}/token/refresh/`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ refresh })
            });
            if (response.ok) {
                const data = await response.json();
                localStorage.setItem('access_token', data.access);
            } else {
                localStorage.removeItem('access_token');
                localStorage.removeItem('refresh_token');
                window.location.href = '/login/';
            }
        } catch {
            window.location.href = '/login/';
        }
    }

    // Initial fetch
    fetchNotes();
</script>
{% endblock %}
